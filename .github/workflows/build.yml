name: build

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore ProjectLiberty.sln
      - name: Build
        run: dotnet build ProjectLiberty.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Tests/ProjectLiberty.Tests.csproj --configuration Release --no-build --no-restore
